<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/style.css">
    <title>Deposit Funds</title>
</head>

<body>

<div class="container">

    <div class="header">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/add-funds">Add Funds</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </div>

    <div class="user-card">

        <div class="user-info">
            <h3>Add Funds</h3>
        </div>

        <form class="form" action="/add-funds" method="POST">

            <div class="form-field">
                <label for="amount">Amount</label>
                <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="1"
                        step="0.01"
                        required>
            </div>

            <div class="form-field">
                <button type="submit" class="submit-btn">
                    Deposit Funds
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
